name: inscribe

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  inscribe:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: inscribe the banner
        run: node --experimental-strip-types tools/palimpsest.ts

      - name: draw the serpent
        run: node --experimental-strip-types tools/serpent.ts

      - name: regenerate the readme
        run: node --experimental-strip-types tools/palimpsest.ts --readme

      - name: commit if the inscription changed
        run: |
          git add -A -- banner-light.svg banner-dark.svg serpent-light.svg serpent-dark.svg
          if git diff --cached --quiet -- banner-light.svg banner-dark.svg serpent-light.svg serpent-dark.svg; then
            echo "banner and serpent bytes unchanged; nothing to inscribe"
            git reset -- banner-light.svg banner-dark.svg serpent-light.svg serpent-dark.svg
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- LEDGER.md README.md
          git commit -m "inscribe: $(git rev-parse --short HEAD) [skip ci]"
          git push

      - name: generate the snake
        uses: Platane/snk@v3
        continue-on-error: true
        with:
          github_user_name: "${{ github.repository_owner }}"
          # Palette discipline: vellum-burnt ground, and an intensity ramp that runs
          # ichor through bone. Every step between is one of those two colours at an
          # alpha step -- an opacity step, not a new hue, exactly as the banner builds
          # its strata. The snake itself is the line colour of its variant.
          outputs: |
            dist/snake-dark.svg?color_snake=#d6cfc0&color_dots=#0b0a09,#6e1f1499,#6e1f14,#d6cfc099,#d6cfc0
            dist/snake-light.svg?color_snake=#0b0a09&color_dots=#d6cfc0,#6e1f1499,#6e1f14,#0b0a0999,#0b0a09

      - name: push the snake to output
        uses: crazy-max/ghaction-github-pages@v5
        continue-on-error: true
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
